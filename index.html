<!-- SCRIPT 3D: HOA ĐÀO & TUYẾT RƠI -->
<script>
    function initThreeJS() {
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const petals = [];
        const petalGeo = new THREE.PlaneGeometry(0.4, 0.7);
        const posAttr = petalGeo.attributes.position;
        for(let i = 0; i < posAttr.count; i++) {
            if(posAttr.getY(i) > 0) { posAttr.setZ(i, 0.1); }
        }
        petalGeo.computeVertexNormals();

        const petalMat = new THREE.MeshBasicMaterial({ 
            color: 0xffa6c9, 
            side: THREE.DoubleSide
        });

        for(let i = 0; i < 100; i++) {
            let petal = new THREE.Mesh(petalGeo, petalMat);
            petal.position.set((Math.random() - 0.5) * 100, Math.random() * 80, (Math.random() - 0.5) * 50 - 10);
            petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            petal.userData = {
                vY: - (Math.random() * 0.08 + 0.03), 
                vX: Math.random() * 0.04 - 0.02,   
                rX: Math.random() * 0.04,            
                rY: Math.random() * 0.04,
                rZ: Math.random() * 0.04
            };
            scene.add(petal);
            petals.push(petal);
        }

        const snowflakeGeo = new THREE.BufferGeometry();
        const snowCount = 400;
        const snowPositions = new Float32Array(snowCount * 3);

        for(let i = 0; i < snowCount * 3; i += 3) {
            snowPositions[i] = (Math.random() - 0.5) * 100;     
            snowPositions[i+1] = (Math.random() - 0.5) * 80;    
            snowPositions[i+2] = (Math.random() - 0.5) * 60;    
        }
        snowflakeGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));

        const snowflakeMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.6,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const snowSystem = new THREE.Points(snowflakeGeo, snowflakeMat);
        scene.add(snowSystem);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            petals.forEach(p => {
                p.position.y += p.userData.vY;
                p.position.x += p.userData.vX + Math.sin(time + p.position.y) * 0.01;
                p.rotation.x += p.userData.rX;
                p.rotation.y += p.userData.rY;
                p.rotation.z += p.userData.rZ;

                if (p.position.y < -35) {
                    p.position.y = 40;
                    p.position.x = (Math.random() - 0.5) * 100;
                }
            });

            const positions = snowflakeGeo.attributes.position.array;
            for(let i = 1; i < positions.length; i += 3) {
                positions[i] -= 0.15;
                positions[i-1] += Math.sin(time + i) * 0.02;

                if(positions[i] < -40) {
                    positions[i] = 40;
                }
            }
            snowflakeGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();
    }
    initThreeJS();
</script>

            type: 'task_error',
            reporterName: reporterName, tasks: checkedTasks, note: errorNote,
            timestamp: new Date().toLocaleString('vi-VN'), status: 'pending'
        }).then(() => {
            if (inputName) localStorage.setItem('savedReporterName', inputName);
            Toast.fire({ icon: 'success', title: 'Thành công', text: 'Đã gửi báo cáo nhiệm vụ lên hệ thống.'});
            document.getElementById('errorNote').value = '';
            document.querySelectorAll('#taskGrid input[type="checkbox"]:checked').forEach(cb => cb.checked = false);
        }).catch(error => Toast.fire({ icon: 'error', title: 'Lỗi', text: error.message }));
    });

    // GỬI YÊU CẦU PROXY
    document.getElementById('btnSubmitProxyReq').addEventListener('click', () => {
        let zaloName = document.getElementById('zaloName').value.trim();
        let accountCount = document.getElementById('accountCount').value.trim();
        
        if (!zaloName || !accountCount) { 
            Toast.fire({ icon: 'warning', title: 'Thiếu thông tin', text: 'Vui lòng nhập Tên Zalo và Số lượng Acc!'}); 
            return; 
        }

        Toast.fire({ title: 'Đang gửi...', didOpen: () => { Swal.showLoading(); } });

        set(push(ref(db, 'error_reports')), {
            type: 'proxy_request',
            zaloName: zaloName, accountCount: accountCount,
            timestamp: new Date().toLocaleString('vi-VN'), status: 'pending'
        }).then(() => {
            Toast.fire({ icon: 'success', title: 'Thành công', text: 'Đã gửi yêu cầu Proxy.'});
            document.getElementById('accountCount').value = '';
        }).catch(error => Toast.fire({ icon: 'error', title: 'Lỗi', text: error.message }));
    });

    // GỬI BÁO LỖI PROXY
    document.getElementById('btnSubmitProxyErr').addEventListener('click', () => {
        let reporterName = document.getElementById('errReporterName').value.trim();
        if (!reporterName) reporterName = "Ẩn danh";
        let proxyIP = document.getElementById('errorProxyIP').value.trim();
        let note = document.getElementById('errorProxyNote').value.trim();
        
        if (!proxyIP) { 
            Toast.fire({ icon: 'warning', title: 'Thiếu thông tin', text: 'Vui lòng nhập Proxy/IP bị lỗi!'}); 
            return; 
        }

        Toast.fire({ title: 'Đang gửi...', didOpen: () => { Swal.showLoading(); } });

        set(push(ref(db, 'error_reports')), {
            type: 'proxy_error',
            reporterName: reporterName, proxyIP: proxyIP, note: note,
            timestamp: new Date().toLocaleString('vi-VN'), status: 'pending'
        }).then(() => {
            Toast.fire({ icon: 'success', title: 'Thành công', text: 'Đã gửi báo lỗi Proxy.'});
            document.getElementById('errorProxyIP').value = '';
            document.getElementById('errorProxyNote').value = '';
        }).catch(error => Toast.fire({ icon: 'error', title: 'Lỗi', text: error.message }));
    });

    // ADMIN LOGIN / LOGOUT / DELETE
    document.getElementById('btnLoginAdmin').addEventListener('click', () => {
        if (document.getElementById('adminCode').value === adminCodeStr) {
            isAdmin = true;
            localStorage.setItem('savedAdminCode', adminCodeStr);
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            Toast.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đăng nhập thành công', showConfirmButton: false, timer: 1500 });
            loadAllData();
        } else { Toast.fire({ icon: 'error', title: 'Từ chối', text: 'Sai mã Admin!'}); }
    });

    document.getElementById('btnLogoutAdmin').addEventListener('click', () => {
        isAdmin = false; localStorage.removeItem('savedAdminCode');
        document.getElementById('adminCode').value = '';
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('adminLoginArea').classList.remove('hidden');
        loadAllData();
    });

    document.getElementById('btnDeleteAll').addEventListener('click', () => {
        Toast.fire({
            title: 'Xóa toàn bộ?', text: "Dữ liệu sẽ mất vĩnh viễn!", icon: 'warning',
            showCancelButton: true, confirmButtonText: 'Xóa', cancelButtonText: 'Hủy'
        }).then((result) => {
            if (result.isConfirmed) {
                remove(ref(db, 'error_reports')).then(() => Toast.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã xóa toàn bộ', showConfirmButton: false, timer: 2000 }));
            }
        });
    });

    // LOAD DỮ LIỆU LÊN GIAO DIỆN
    function loadAllData() {
        onValue(ref(db, 'error_reports'), (snapshot) => {
            const data = snapshot.val();
            const reportListDiv = document.getElementById('reportList');
            reportListDiv.innerHTML = ''; 

            if (data) {
                const keys = Object.keys(data).reverse();
                keys.forEach(key => {
                    const report = data[key];
                    const isFixed = report.status === 'fixed';
                    const type = report.type || 'task_error'; // Backward compatibility
                    
                    let titleHtml = '';
                    let userHtml = '';
                    let tagsHtml = ''; 
                    let noteHtml = ''; 
                    
                    if (report.note && report.note.trim() !== '') {
                        noteHtml = `<div class="report-note">${report.note}</div>`;
                    }

                    // Phân loại hiển thị theo Type
                    if (type === 'task_error') {
                        titleHtml = `<span style="color: #fde047; font-weight: 800;">[LỖI NHIỆM VỤ]</span>`;
                        userHtml = `👤 ${report.reporterName || 'Ẩn danh'}`;
                        if(report.tasks) report.tasks.forEach(t => tagsHtml += `<span class="tag">${t}</span>`);
                    } else if (type === 'proxy_request') {
                        titleHtml = `<span style="color: #fbbf24; font-weight: 800;">[YÊU CẦU PROXY]</span>`;
                        userHtml = `💬 Zalo: ${report.zaloName}`;
                        tagsHtml = `<span class="tag" style="background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3);">Số lượng acc: ${report.accountCount}</span>`;
                    } else if (type === 'proxy_error') {
                        titleHtml = `<span style="color: #f87171; font-weight: 800;">[BÁO LỖI PROXY]</span>`;
                        userHtml = `👤 ${report.reporterName || 'Ẩn danh'}`;
                        tagsHtml = `<span class="tag" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3);">IP Proxy: ${report.proxyIP}</span>`;
                    }

                    const item = document.createElement('div');
                    item.className = `report-item ${isFixed ? 'fixed' : ''}`;
                    
                    let actionHtml = isFixed 
                        ? `<span class="status-badge status-fixed">✔ Đã Xử Lý Xong</span>` 
                        : (isAdmin ? `<button class="btn btn-fix btn-mark-fix" data-id="${key}">✅ Đánh dấu Đã Xong</button>` : `<span class="status-badge status-pending">⏳ Đang xử lý</span>`);

                    item.innerHTML = `
                        <div class="report-header">
                            <div class="report-user">${titleHtml}<br><span style="font-weight: 500; font-size: 13.5px; opacity: 0.9;">${userHtml}</span></div>
                            <div class="report-time">${report.timestamp}</div>
                        </div>
                        <div class="tags">${tagsHtml}</div>
                        ${noteHtml}
                        <div class="action-area">${actionHtml}</div>
                    `;
                    reportListDiv.appendChild(item);
                });

                document.querySelectorAll('.btn-mark-fix').forEach(btn => {
                    btn.addEventListener('click', function() {
                        update(ref(db, 'error_reports/' + this.getAttribute('data-id')), { status: 'fixed' });
                        Toast.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã xử lý xong!', showConfirmButton: false, timer: 1500 });
                    });
                });
            } else { 
                reportListDiv.innerHTML = '<div style="text-align:center; padding: 20px; color: rgba(255,255,255,0.6); font-size: 13.5px;">Chưa có dữ liệu nào.</div>'; 
            }
        });
    }
</script>
</body>
</html>
